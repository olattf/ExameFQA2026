<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preparação Exame Física e Química A 2026</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --container-bg: #161b22;
            --sidebar-bg: #010409;
            --text-color: #c9d1d9;
            --text-muted: #8b949e;
            --border-color: #30363d;
            --button-bg: #21262d;
            --button-hover: #30363d;
            --correct-color: #238636;
            --incorrect-color: #da3633;
            --partial-color: #2f81f7;
            --accent-color: #f08c00;
        }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .layout { display: flex; width: 100%; height: 100%; }
        .sidebar { width: 300px; background-color: var(--sidebar-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; overflow-y: auto; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border-color); font-weight: bold; font-size: 16px; color: #f0f6fc; }
        .sidebar-content { padding: 15px; flex: 1; }
        .sb-mode-badge { display: inline-block; font-size: 11px; background-color: var(--button-bg); padding: 2px 6px; border-radius: 4px; margin-top: 5px; color: var(--accent-color); border: 1px solid var(--border-color); }
        .sb-year { font-weight: bold; margin-top: 15px; margin-bottom: 5px; color: #f0f6fc; }
        .sb-subject { font-weight: 600; margin-left: 10px; margin-top: 10px; color: var(--text-color); }
        .sb-domain { font-size: 14px; margin-left: 20px; margin-top: 8px; color: var(--text-muted); }
        .sb-sub { font-size: 13px; margin-left: 30px; margin-top: 5px; display: flex; align-items: center; gap: 8px; color: var(--text-muted); }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
        .status-none { background-color: transparent; border: 1px solid var(--text-muted); }
        .status-partial { background-color: var(--partial-color); border: 1px solid var(--partial-color); }
        .status-complete { background-color: var(--correct-color); border: 1px solid var(--correct-color); }
        .sidebar-footer { padding: 15px; border-top: 1px solid var(--border-color); background-color: rgba(0,0,0,0.2); }
        .main-wrapper { flex: 1; display: flex; flex-direction: column; overflow-y: auto; position: relative; }
        .content-area { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 20px; }
        .container { background-color: var(--container-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 30px; width: 100%; max-width: 700px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .footer { text-align: center; padding: 15px; color: var(--text-muted); font-size: 13px; border-top: 1px solid var(--border-color); background-color: var(--container-bg); }
        .mode-selection { text-align: center; }
        .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 30px 0; }
        .mode-card { background-color: var(--button-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 30px 20px; cursor: pointer; transition: transform 0.2s, border-color 0.2s, background-color 0.2s; text-align: center; }
        .mode-card:hover { border-color: var(--accent-color); background-color: var(--button-hover); transform: translateY(-2px); }
        .mode-icon { font-size: 40px; margin-bottom: 15px; display: block; }
        .mode-card h3 { margin: 0 0 10px 0; font-size: 20px; color: #f0f6fc; }
        .mode-card p { margin: 0; font-size: 14px; color: var(--text-muted); line-height: 1.4; }
        .warning-box { background-color: rgba(240, 140, 0, 0.1); border: 1px solid rgba(240, 140, 0, 0.4); color: #ffb54d; padding: 15px; border-radius: 6px; font-size: 13px; line-height: 1.5; margin-top: 20px; text-align: left; }
        h1 { color: #f0f6fc; margin-top: 0; font-size: 22px; text-align: center; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; margin-bottom: 15px; }
        h2, h3 { color: #f0f6fc; margin-top: 0; }
        .menu-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .btn { background-color: var(--button-bg); color: var(--text-color); border: 1px solid var(--border-color); padding: 12px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; text-align: left; transition: background-color 0.2s, border-color 0.2s; width: 100%; box-sizing: border-box; }
        .btn:hover:not(:disabled) { background-color: var(--button-hover); border-color: #8b949e; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn.correct { background-color: var(--correct-color); border-color: var(--correct-color); color: #ffffff; }
        .btn.incorrect { background-color: var(--incorrect-color); border-color: var(--incorrect-color); color: #ffffff; }
        .breadcrumb { font-size: 13px; color: var(--text-muted); background-color: rgba(48, 54, 61, 0.2); padding: 8px 12px; border-radius: 4px; border: 1px solid rgba(48, 54, 61, 0.5); margin-bottom: 20px; line-height: 1.4; }
        .options-grid { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
        .feedback-box { margin-top: 20px; padding: 15px; border-radius: 6px; font-size: 15px; line-height: 1.6; display: none; white-space: pre-line; }
        .feedback-box.wrong { background-color: rgba(218, 54, 51, 0.1); border: 1px solid var(--incorrect-color); color: #ff7b72; }
        .feedback-box.right { background-color: rgba(35, 134, 54, 0.1); border: 1px solid var(--correct-color); color: #56d364; }
        .action-area { margin-top: 25px; display: flex; justify-content: flex-end; }
        .btn-next { background-color: #238636; color: #ffffff; border: 1px solid rgba(240,246,252,0.1); padding: 10px 20px; font-weight: 600; text-align: center; }
        .btn-next:hover { background-color: #2ea043; }
        .navigation-controls { margin-top: 20px; padding-top: 15px; border-top: 1px solid var(--border-color); display: flex; gap: 10px; }
        .btn-nav { background: transparent; color: var(--text-muted); border: 1px solid var(--border-color); padding: 8px 14px; font-size: 14px; border-radius: 6px; cursor: pointer; flex: 1; text-align: center; }
        .btn-nav:hover { color: var(--text-color); border-color: #8b949e; background-color: var(--button-bg); }
        .btn-reset { background-color: rgba(218, 54, 51, 0.1); color: #ff7b72; border: 1px solid rgba(218, 54, 51, 0.4); padding: 8px 12px; font-size: 12px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: 600; transition: background-color 0.2s; }
        .btn-reset:hover { background-color: var(--incorrect-color); color: #ffffff; }
        .completed-badge { float: right; font-size: 12px; background-color: rgba(35, 134, 54, 0.2); color: #56d364; padding: 2px 8px; border-radius: 12px; border: 1px solid var(--correct-color); }
        @media (max-width: 768px) {
            .layout { flex-direction: column; }
            .sidebar { width: 100%; height: 200px; border-right: none; border-bottom: 1px solid var(--border-color); }
            .mode-grid { grid-template-columns: 1fr; gap: 15px; }
            .content-area { padding: 20px 10px; }
        }
    </style>
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div>Progresso do Estudo</div>
                <div id="mode-badge-container"></div>
            </div>
            <div class="sidebar-content" id="sidebar-content"></div>
            <div class="sidebar-footer" id="sidebar-footer-area" style="display:none;">
                <button class="btn-reset" onclick="triggerFullReset()">Apagar Todo o Progresso</button>
            </div>
        </aside>
        <div class="main-wrapper">
            <div class="content-area">
                <div class="container">
                    <h1>Preparação Exame Física e Química A 2026</h1>
                    <div id="app-content"></div>
                </div>
            </div>
            <footer class="footer">Desenvolvido por @olattf</footer>
        </div>
    </div>

    <script>
        // ── Carregar dados dos blocos JSON embutidos no HTML ──────────────
        // Isto funciona tanto em file:// como em http://
        const allData = {
            completo:  JSON.parse(document.getElementById('data-completo').textContent),
            resumido:  JSON.parse(document.getElementById('data-resumido').textContent)
        };

        // ── Estado da aplicação ───────────────────────────────────────────
        let currentPath = { year: null, subject: null, domain: null, subdomain: null };
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let canAnswer = true;
        let studyMode = localStorage.getItem('study_mode');
        let quizData = null;

        // ── Chaves localStorage ───────────────────────────────────────────
        function getCompletedKey(year, subject, domain, sub) {
            return `completed_${year}_${subject}_${domain}_${sub}`;
        }
        function getProgressKey(year, subject, domain, sub) {
            return `progress_${year}_${subject}_${domain}_${sub}`;
        }

        // ── Carregar dados do modo escolhido (sem fetch, sem scripts externos) ──
        function loadData(mode) {
            quizData = allData[mode];
        }

        // ── Sidebar ───────────────────────────────────────────────────────
        function renderSidebar() {
            const badgeContainer = document.getElementById('mode-badge-container');
            const footerArea = document.getElementById('sidebar-footer-area');

            if (!studyMode || !quizData) {
                badgeContainer.innerHTML = '';
                document.getElementById('sidebar-content').innerHTML =
                    '<div style="padding:10px; color:var(--text-muted); font-size:13px;">Escolha o modo de estudo para ver o progresso.</div>';
                footerArea.style.display = 'none';
                return;
            }

            footerArea.style.display = 'block';
            badgeContainer.innerHTML = `<span class="sb-mode-badge">Modo: ${studyMode === 'completo' ? 'Completo' : 'Resumido'}</span>`;

            let html = '';
            for (const year in quizData) {
                html += `<div class="sb-year">${year}º Ano</div>`;
                for (const subject in quizData[year]) {
                    html += `<div class="sb-subject">${subject}</div>`;
                    for (const domain in quizData[year][subject]) {
                        html += `<div class="sb-domain">${domain}</div>`;
                        for (const sub in quizData[year][subject][domain]) {
                            const isDone = localStorage.getItem(getCompletedKey(year, subject, domain, sub));
                            const progress = parseInt(localStorage.getItem(getProgressKey(year, subject, domain, sub)) || '0');
                            const listLength = (quizData[year][subject][domain][sub] || []).length;

                            let statusClass = "status-none";
                            if (listLength > 0) {
                                if (isDone) statusClass = "status-complete";
                                else if (progress > 0) statusClass = "status-partial";
                            }

                            html += `<div class="sb-sub">
                                <span class="status-dot ${statusClass}"></span>
                                <span>${sub}</span>
                            </div>`;
                        }
                    }
                }
            }
            document.getElementById('sidebar-content').innerHTML = html;
        }

        // ── Breadcrumb ────────────────────────────────────────────────────
        function buildBreadcrumb() {
            let parts = [];
            if (currentPath.year)      parts.push(`${currentPath.year}º Ano`);
            if (currentPath.subject)   parts.push(currentPath.subject);
            if (currentPath.domain)    parts.push(currentPath.domain);
            if (currentPath.subdomain) parts.push(currentPath.subdomain);
            if (parts.length === 0) return '';
            return `<div class="breadcrumb">${parts.join(' &gt; ')}</div>`;
        }

        // ── Navegação ─────────────────────────────────────────────────────
        function renderNavigation(currentLevel) {
            if (!currentPath.year) return '';
            return `<div class="navigation-controls">
                <button class="btn-nav" onclick="resetPath('${currentLevel}')">← Voltar</button>
                <button class="btn-nav" onclick="resetToHome()">Menu Inicial</button>
            </div>`;
        }

        // ── Roteador principal ────────────────────────────────────────────
        function renderApp() {
            studyMode = localStorage.getItem('study_mode');

            if (!studyMode) {
                quizData = null;
                renderSidebar();
                renderModeSelection();
                return;
            }

            if (!quizData) loadData(studyMode);
            renderSidebar();
            navigateContent();
        }

        function navigateContent() {
            if (!currentPath.year)           renderYears();
            else if (!currentPath.subject)   renderSubjects();
            else if (!currentPath.domain)    renderDomains();
            else if (!currentPath.subdomain) renderSubdomains();
            else                             renderQuiz();
        }

        // ── Ecrã de seleção de modo ───────────────────────────────────────
        function renderModeSelection() {
            document.getElementById('app-content').innerHTML = `
                <div class="mode-selection">
                    <h2>Bem-vindo! Escolha o Modo de Estudo</h2>
                    <p style="color:var(--text-muted);font-size:15px;">Selecione como quer gerir o volume de exercícios da aplicação:</p>
                    <div class="mode-grid">
                        <div class="mode-card" onclick="setStudyMode('completo')">
                            <span class="mode-icon">📚</span>
                            <h3>Modo Completo</h3>
                            <p>Acede a absolutamente todas as perguntas disponíveis nos manuais sem restrições.</p>
                        </div>
                        <div class="mode-card" onclick="setStudyMode('resumido')">
                            <span class="mode-icon">⚡</span>
                            <h3>Modo Resumido</h3>
                            <p>Focado em revisões rápidas. Contém apenas uma seleção manual das 10 perguntas mais importantes por subunidade.</p>
                        </div>
                    </div>
                    <div class="warning-box">
                        <strong>⚠️ Atenção:</strong> Esta escolha define a base de dados da aplicação. Para alterar entre o Modo Completo e o Modo Resumido mais tarde, terá de limpar todo o progresso de estudo guardado no dispositivo.
                    </div>
                </div>`;
        }

        function setStudyMode(mode) {
            localStorage.setItem('study_mode', mode);
            studyMode = mode;
            loadData(mode);
            renderSidebar();
            navigateContent();
        }

        function triggerFullReset() {
            if (confirm("Tem a certeza que deseja apagar todo o progresso de estudo e definições? Esta ação não pode ser desfeita e vai reiniciar a aplicação.")) {
                localStorage.clear();
                studyMode = null;
                quizData = null;
                currentPath = { year: null, subject: null, domain: null, subdomain: null };
                renderApp();
            }
        }

        // ── Ecrãs de navegação ────────────────────────────────────────────
        function renderYears() {
            let html = '<h2>Selecionar Ano de Escolaridade</h2><div class="menu-grid">';
            Object.keys(quizData).forEach(year => {
                html += `<button class="btn" onclick="selectYear('${year}')">${year}º Ano</button>`;
            });
            html += '</div>';
            document.getElementById('app-content').innerHTML = html;
        }

        function selectYear(year) {
            currentPath = { year, subject: null, domain: null, subdomain: null };
            renderApp();
        }

        function renderSubjects() {
            let html = buildBreadcrumb();
            html += '<h2>Selecionar Disciplina</h2><div class="menu-grid">';
            Object.keys(quizData[currentPath.year]).forEach(subject => {
                html += `<button class="btn" onclick="selectSubject('${subject}')">${subject}</button>`;
            });
            html += '</div>' + renderNavigation('subject');
            document.getElementById('app-content').innerHTML = html;
        }

        function selectSubject(subject) {
            currentPath.subject = subject;
            currentPath.domain = null;
            currentPath.subdomain = null;
            renderApp();
        }

        function renderDomains() {
            let html = buildBreadcrumb();
            html += '<h2>Selecionar Domínio</h2><div class="menu-grid">';
            Object.keys(quizData[currentPath.year][currentPath.subject]).forEach(domain => {
                html += `<button class="btn" onclick="selectDomain('${domain}')">${domain}</button>`;
            });
            html += '</div>' + renderNavigation('domain');
            document.getElementById('app-content').innerHTML = html;
        }

        function selectDomain(domain) {
            currentPath.domain = domain;
            currentPath.subdomain = null;
            renderApp();
        }

        function renderSubdomains() {
            let html = buildBreadcrumb();
            html += '<h2>Selecionar Subdomínio</h2><div class="menu-grid">';
            Object.keys(quizData[currentPath.year][currentPath.subject][currentPath.domain]).forEach(sub => {
                const isDone = localStorage.getItem(getCompletedKey(currentPath.year, currentPath.subject, currentPath.domain, sub));
                const badge = isDone ? '<span class="completed-badge">Completo ✓</span>' : '';
                html += `<button class="btn" onclick="selectSubdomain('${sub}')">${sub}${badge}</button>`;
            });
            html += '</div>' + renderNavigation('subdomain');
            document.getElementById('app-content').innerHTML = html;
        }

        function selectSubdomain(sub) {
            currentPath.subdomain = sub;
            currentQuestions = quizData[currentPath.year][currentPath.subject][currentPath.domain][sub] || [];

            const savedProgress = localStorage.getItem(getProgressKey(currentPath.year, currentPath.subject, currentPath.domain, sub));
            const isCompleted   = localStorage.getItem(getCompletedKey(currentPath.year, currentPath.subject, currentPath.domain, sub));
            currentQuestionIndex = (savedProgress && !isCompleted) ? parseInt(savedProgress) : 0;
            canAnswer = true;
            renderApp();
        }

        // ── Quiz ──────────────────────────────────────────────────────────
        function renderQuiz() {
            if (currentQuestions.length === 0) {
                document.getElementById('app-content').innerHTML = `
                    ${buildBreadcrumb()}
                    <h2>Sem perguntas</h2>
                    <p>Ainda não foram adicionadas perguntas a este subdomínio neste modo de estudo.</p>
                    <div class="navigation-controls">
                        <button class="btn-nav" onclick="resetPath('subdomain')">← Voltar</button>
                        <button class="btn-nav" onclick="resetToHome()">Menu Inicial</button>
                    </div>`;
                return;
            }

            if (currentQuestionIndex >= currentQuestions.length) {
                localStorage.setItem(getCompletedKey(currentPath.year, currentPath.subject, currentPath.domain, currentPath.subdomain), "true");
                localStorage.removeItem(getProgressKey(currentPath.year, currentPath.subject, currentPath.domain, currentPath.subdomain));
                renderSidebar();
                document.getElementById('app-content').innerHTML = `
                    ${buildBreadcrumb()}
                    <h2>Subdomínio Concluído ✓</h2>
                    <p>Respondeste com sucesso a todos os exercícios deste subdomínio no modo <strong>${studyMode === 'completo' ? 'Completo' : 'Resumido'}</strong>.</p>
                    <div class="navigation-controls">
                        <button class="btn-nav" onclick="resetPath('subdomain')">← Voltar</button>
                        <button class="btn-nav" onclick="resetToHome()">Menu Inicial</button>
                    </div>`;
                return;
            }

            const q = currentQuestions[currentQuestionIndex];
            let html = buildBreadcrumb();
            html += `<div style="font-size:14px;color:var(--text-muted);margin-bottom:10px;">Pergunta ${currentQuestionIndex + 1} de ${currentQuestions.length}</div>`;
            html += `<h3 style="line-height:1.5;white-space:pre-line;">${q.enunciado}</h3>`;
            html += `<div class="options-grid">`;
            q.opcoes.forEach((opcao, index) => {
                html += `<button class="btn option-btn" id="opt-${index}" onclick="checkAnswer(${index})">${opcao}</button>`;
            });
            html += `</div>`;
            html += `<div class="feedback-box" id="feedback"></div>`;
            html += `<div class="action-area" id="action-area"></div>`;
            html += renderNavigation('subdomain');
            document.getElementById('app-content').innerHTML = html;
        }

        function checkAnswer(selectedIndex) {
            if (!canAnswer) return;
            const q = currentQuestions[currentQuestionIndex];
            const feedback    = document.getElementById('feedback');
            const actionArea  = document.getElementById('action-area');
            const selectedBtn = document.getElementById(`opt-${selectedIndex}`);

            if (selectedIndex === q.correta) {
                canAnswer = false;
                document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);
                selectedBtn.disabled = false;
                selectedBtn.classList.add('correct');

                feedback.className = "feedback-box right";
                feedback.innerHTML = `<strong>Resposta Correta.</strong>\n\n${q.resolucao}`;
                feedback.style.display = "block";
                actionArea.innerHTML = `<button class="btn btn-next" onclick="nextQuestion()">Seguinte →</button>`;

                localStorage.setItem(
                    getProgressKey(currentPath.year, currentPath.subject, currentPath.domain, currentPath.subdomain),
                    currentQuestionIndex + 1
                );
                renderSidebar();
            } else {
                selectedBtn.classList.add('incorrect');
                selectedBtn.disabled = true;

                const explicacao = (q.explicacoes && q.explicacoes[String(selectedIndex)])
                    ? q.explicacoes[String(selectedIndex)]
                    : 'Esta opção está incorreta. Tenta outra resposta.';

                feedback.className = "feedback-box wrong";
                feedback.innerHTML = `<strong>Opção Incorreta.</strong>\n${explicacao}`;
                feedback.style.display = "block";
            }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            canAnswer = true;
            renderQuiz();
        }

        function resetPath(level) {
            if (level === 'year')      { currentPath.year = null; currentPath.subject = null; currentPath.domain = null; currentPath.subdomain = null; }
            else if (level === 'subject')   { currentPath.subject = null; currentPath.domain = null; currentPath.subdomain = null; }
            else if (level === 'domain')    { currentPath.domain = null; currentPath.subdomain = null; }
            else if (level === 'subdomain') { currentPath.subdomain = null; }
            renderApp();
        }

        function resetToHome() {
            currentPath = { year: null, subject: null, domain: null, subdomain: null };
            renderApp();
        }

        // ── Arrancar ──────────────────────────────────────────────────────
        renderApp();
    </script>
</body>
</html>
